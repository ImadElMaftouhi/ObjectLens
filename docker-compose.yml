services:
  mongo:
    build: ./db
    container_name: objectlens-mongo
    restart: unless-stopped
    networks:
      - objectlens-network
    environment:
      - MONGO_INITDB_DATABASE=objectlens
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 30

